      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="logo_drop" x="-4" y="-2" width="86" height="86" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>

<svg width="78" height="78" viewBox="0 0 78 78" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo_bg_grad" x1="0" y1="0" x2="78" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A2540"/>
      <stop offset="0.65" stop-color="#153E75"/>
      <stop offset="1" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="bag_grad" x1="28" y1="16" x2="44" y2="34" gradientUnits="userSpaceOnUse">
